<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>قارئ الأرقام</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
canvas#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;padding:10px 12px;background:linear-gradient(#000a,#0000);display:flex;justify-content:space-between;align-items:center;font-size:14px}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 12px 22px;background:linear-gradient(#0000,#000d);text-align:center}
#nums{font-size:44px;font-weight:700;letter-spacing:2px;direction:ltr;min-height:56px;color:#ffd54a;word-break:break-all}
#start{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#000;z-index:5}
button{font:inherit;border:0;border-radius:12px;padding:14px 28px;font-size:18px;background:#ffd54a;color:#000;font-weight:700}
#msg{font-size:14px;opacity:.8;padding:0 20px;text-align:center}
</style>
</head>
<body>
<div id="start">
  <div style="font-size:26px;font-weight:700">قارئ الأرقام</div>
  <button id="go">ابدأ الكاميرا</button>
  <div id="msg"></div>
</div>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="top"><span id="st">...</span><span id="mute" style="cursor:pointer">🔊</span></div>
  <div id="bottom"><div id="nums">—</div></div>
</div>

<script>
(function(){
var v=document.getElementById('v'),ov=document.getElementById('ov'),octx=ov.getContext('2d');
var nums=document.getElementById('nums'),st=document.getElementById('st'),msg=document.getElementById('msg');
var work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
var worker=null,busy=false,voiceOn=true,lastSpoken={},stream=null,seen={};
var arVoice=null,frVoice=null,enVoice=null;

function pickVoice(){
  var vs=speechSynthesis.getVoices();
  arVoice=vs.find(function(x){return /^ar/i.test(x.lang)})||null;
  frVoice=vs.find(function(x){return /^fr/i.test(x.lang)})||null;
  enVoice=vs.find(function(x){return /^en/i.test(x.lang)})||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

/* nombres dits en mots arabes (le 10 en entier, le roi K) */
var AR={'1':'واحد','2':'اثنان','3':'ثلاثة','4':'أربعة','5':'خمسة','6':'ستة','7':'سبعة','8':'ثمانية','9':'تسعة','10':'عشرة','K':'ملك','Q':'ملكة','J':'ولد','JOKER':'جوكر'};
/* arabe par défaut ; si le téléphone n'a pas de voix arabe : français, sinon anglais */
var PACKS={
  ar:{lang:'ar-SA',n:AR,s:{r:'أحمر',n:'أسود',h:'كور',d:'كارو',s:'بيك',c:'تريفل',j:''}},
  fr:{lang:'fr-FR',n:{'1':'un','2':'deux','3':'trois','4':'quatre','5':'cinq','6':'six','7':'sept','8':'huit','9':'neuf','10':'dix','K':'roi','Q':'dame','J':'valet','JOKER':'joker'},s:{r:'rouge',n:'noir',h:'cœur',d:'carreau',s:'pique',c:'trèfle',j:''}},
  en:{lang:'en-US',n:{'1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','K':'king','Q':'queen','J':'jack','JOKER':'joker'},s:{r:'red',n:'black',h:'hearts',d:'diamonds',s:'spades',c:'clubs',j:''}}
};
function pickPack(){
  if(arVoice)return {p:PACKS.ar,v:arVoice};
  if(frVoice)return {p:PACKS.fr,v:frVoice};
  if(enVoice)return {p:PACKS.en,v:enVoice};
  return {p:PACKS.ar,v:null};
}
var actx=null;
function beep(){
  if(!voiceOn)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime;
    o.frequency.value=880;
    g.gain.setValueAtTime(0.25,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+0.15);
    o.connect(g);g.connect(actx.destination);
    o.start(t0);o.stop(t0+0.15);
  }catch(e){}
}

function speak(t,lang,voice){
  if(!voiceOn||!('speechSynthesis' in window))return;
  var u=new SpeechSynthesisUtterance(t);
  var vo=lang?voice:arVoice;
  u.lang=lang||'ar-SA';if(vo)u.voice=vo;u.rate=0.9;
  speechSynthesis.speak(u);
}

document.getElementById('mute').onclick=function(){
  voiceOn=!voiceOn;this.textContent=voiceOn?'🔊':'🔇';
  if(!voiceOn)speechSynthesis.cancel();
};

function fit(){ov.width=innerWidth;ov.height=innerHeight;}
addEventListener('resize',fit);fit();

document.getElementById('go').onclick=async function(){
  msg.textContent='...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=stream;await v.play();
  }catch(e){msg.textContent='تعذّر فتح الكاميرا: '+e.message;return;}
  document.getElementById('start').style.display='none';
  speak('');
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  st.textContent='تحميل...';
  try{
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'10'});
  }catch(e){st.textContent='خطأ: '+e.message;return;}
  st.textContent='جاهز';
  loop();
};

var cc=document.createElement('canvas'),cx=cc.getContext('2d');
var rc=document.createElement('canvas'),rx=rc.getContext('2d');
var mc=document.createElement('canvas'),mx2=mc.getContext('2d');

function prep(){
  var vw=v.videoWidth,vh=v.videoHeight;
  if(!vw)return null;
  var s=Math.min(1,1280/vw),W=Math.round(vw*s),H=Math.round(vh*s);
  work.width=W;work.height=H;
  wctx.drawImage(v,0,0,W,H);
  var p=wctx.getImageData(0,0,W,H).data,N=W*H,gray=new Uint8Array(N),hist=new Array(256).fill(0),i,g;
  for(i=0;i<N;i++){g=(0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2])|0;gray[i]=g;hist[g]++;}
  var sum=0;for(i=0;i<256;i++)sum+=i*hist[i];
  var sB=0,wB=0,mx=0,th=128;
  for(i=0;i<256;i++){
    wB+=hist[i];if(!wB)continue;
    var wF=N-wB;if(!wF)break;
    sB+=i*hist[i];
    var mB=sB/wB,mF=(sum-sB)/wF,bt=wB*wF*(mB-mF)*(mB-mF);
    if(bt>mx){mx=bt;th=i;}
  }
  var ink=new Uint8Array(N);
  for(i=0;i<N;i++)ink[i]=gray[i]<=th?1:0;
  return {w:W,h:H,ink:ink,rgb:p};
}

function blobs(d){
  var W=d.w,H=d.h,ink=d.ink,N=W*H,lab=new Int32Array(N),stack=new Int32Array(N),res=[],id=0,s0;
  for(s0=0;s0<N;s0++){
    if(!ink[s0]||lab[s0])continue;
    id++;var sp=0;stack[sp++]=s0;lab[s0]=id;
    var x0=W,y0=H,x1=0,y1=0,area=0;
    while(sp){
      var q=stack[--sp],qx=q%W,qy=(q-qx)/W;
      area++;
      if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      if(qx>0&&ink[q-1]&&!lab[q-1]){lab[q-1]=id;stack[sp++]=q-1;}
      if(qx<W-1&&ink[q+1]&&!lab[q+1]){lab[q+1]=id;stack[sp++]=q+1;}
      if(qy>0&&ink[q-W]&&!lab[q-W]){lab[q-W]=id;stack[sp++]=q-W;}
      if(qy<H-1&&ink[q+W]&&!lab[q+W]){lab[q+W]=id;stack[sp++]=q+W;}
    }
    var w=x1-x0+1,h=y1-y0+1;
    if(h<H*0.025||h>H*0.25||w>W*0.2)continue;
    if(x0===0||y0===0||x1===W-1||y1===H-1)continue;
    if(h/w<0.5||h/w>8||area<30)continue;
    res.push({id:id,x0:x0,y0:y0,x1:x1+1,y1:y1+1,w:w,h:h});
  }
  return {list:res,lab:lab};
}

function blobImg(d,b,lab){
  mc.width=b.w;mc.height=b.h;
  var im=mx2.createImageData(b.w,b.h),o=im.data,x,y,k=0;
  for(y=b.y0;y<b.y1;y++)for(x=b.x0;x<b.x1;x++){
    var c=lab[y*d.w+x]===b.id?0:255;
    o[k++]=c;o[k++]=c;o[k++]=c;o[k++]=255;
  }
  mx2.putImageData(im,0,0);
  var sc=100/b.h,tw=Math.max(1,Math.round(b.w*sc));
  cc.width=tw+60;cc.height=160;
  cx.fillStyle='#fff';cx.fillRect(0,0,cc.width,cc.height);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(mc,30,30,tw,100);
  return cc;
}

function regionImg(d,x0,y0,x1,y1){
  var w=x1-x0,h=y1-y0;
  mc.width=w;mc.height=h;
  var im=mx2.createImageData(w,h),o=im.data,x,y,k=0;
  for(y=y0;y<y1;y++)for(x=x0;x<x1;x++){
    var c=d.ink[y*d.w+x]?0:255;
    o[k++]=c;o[k++]=c;o[k++]=c;o[k++]=255;
  }
  mx2.putImageData(im,0,0);
  var sc=100/h,tw=Math.max(1,Math.round(w*sc));
  cc.width=tw+60;cc.height=160;
  cx.fillStyle='#fff';cx.fillRect(0,0,cc.width,cc.height);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(mc,30,30,tw,100);
  return cc;
}

function cardColor(d,bb){
  var r=0,t=0,x,y;
  for(y=bb.y0;y<bb.y1;y++)for(x=bb.x0;x<bb.x1;x++){
    var i=y*d.w+x;
    if(!d.ink[i])continue;
    var R=d.rgb[i*4],G=d.rgb[i*4+1],B=d.rgb[i*4+2];
    t++;
    if(R>90&&R>G*1.5&&R>B*1.5)r++;
  }
  return t&&r/t>0.3?'r':'n';
}

function cardBox(d,bb){
  var W=d.w,H=d.h,sx=bb.x0-4,sy=Math.round((bb.y0+bb.y1)/2),k=0;
  if(sx<1)return null;
  while(sx>0&&d.ink[sy*W+sx]&&k<40){sx--;k++;}
  if(sx<=0||d.ink[sy*W+sx])return null;
  var vis=new Uint8Array(W*H),stk=new Int32Array(W*H),sp=0,s0=sy*W+sx;
  var x0=W,y0=H,x1=0,y1=0,cnt=0;
  vis[s0]=1;stk[sp++]=s0;
  while(sp){
    var q=stk[--sp],qx=q%W,qy=(q-qx)/W;
    cnt++;
    if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
    if(qx>0&&!d.ink[q-1]&&!vis[q-1]){vis[q-1]=1;stk[sp++]=q-1;}
    if(qx<W-1&&!d.ink[q+1]&&!vis[q+1]){vis[q+1]=1;stk[sp++]=q+1;}
    if(qy>0&&!d.ink[q-W]&&!vis[q-W]){vis[q-W]=1;stk[sp++]=q-W;}
    if(qy<H-1&&!d.ink[q+W]&&!vis[q+W]){vis[q+W]=1;stk[sp++]=q+W;}
  }
  if(cnt>W*H*0.6)return null;
  return {x0:x0,y0:y0,x1:x1+1,y1:y1+1};
}

function pipCount(cb,all){
  return all.filter(function(b){
    return b.x0>=cb.x0&&b.x1<=cb.x1&&b.y0>=cb.y0&&b.y1<=cb.y1;
  }).length;
}

function cardColor2(d,lab,list,cb){
  var r=0,t=0;
  list.forEach(function(b){
    if(b.x0<cb.x0||b.x1>cb.x1||b.y0<cb.y0||b.y1>cb.y1)return;
    var x,y;
    for(y=b.y0;y<b.y1;y++)for(x=b.x0;x<b.x1;x++){
      var i=y*d.w+x;
      if(lab[i]!==b.id)continue;
      var R=d.rgb[i*4],G=d.rgb[i*4+1],B=d.rgb[i*4+2],mx=Math.max(R,G,B);
      t++;
      if(R>=G&&R>=B&&mx>0&&(R-Math.max(G,B))/mx>0.3)r++;
    }
  });
  return t&&r/t>0.5?'r':'n';
}

function suitTemplates(){
  if(SUIT_TPL)return SUIT_TPL;
  var n=SUIT_N*SUIT_N;
  SUIT_TPL={};
  Object.keys(SUIT_LIB).forEach(function(k){
    SUIT_TPL[k]=SUIT_LIB[k].map(function(sb){
      var bin=atob(sb),a=new Uint8Array(n),b=new Uint8Array(n),i;
      for(i=0;i<n;i++)a[i]=(bin.charCodeAt(i>>3)>>(i&7))&1;
      for(i=0;i<n;i++)b[i]=a[n-1-i];
      return {a:a,b:b};
    });
  });
  return SUIT_TPL;
}

function suitScore(m,list){
  var best=0,i,s;
  for(i=0;i<list.length;i++){
    s=Math.max(suitIou(m,list[i].a),suitIou(m,list[i].b));
    if(s>best)best=s;
  }
  return best;
}

function suitMask(d,lab,b){
  var N=SUIT_N,cnt=new Uint16Array(N*N),tot=new Uint16Array(N*N),m=new Uint8Array(N*N),x,y,i;
  for(y=b.y0;y<b.y1;y++){
    var gy=Math.min(N-1,((y-b.y0)*N/b.h)|0);
    for(x=b.x0;x<b.x1;x++){
      var gx=Math.min(N-1,((x-b.x0)*N/b.w)|0);
      tot[gy*N+gx]++;
      if(lab[y*d.w+x]===b.id)cnt[gy*N+gx]++;
    }
  }
  for(i=0;i<N*N;i++)m[i]=tot[i]&&cnt[i]*2>tot[i]?1:0;
  return m;
}

function suitIou(p,q){
  var a=0,o=0,i;
  for(i=0;i<p.length;i++){if(p[i]&&q[i])a++;if(p[i]||q[i])o++;}
  return o?a/o:0;
}

/* signe de la carte : rouge = cœur (h) ou carreau (d), noir = pique (s) ou trèfle (c) ; la forme départage, symbole droit ou renversé */
function suitOf(d,lab,list,cb,col){
  var T=suitTemplates(),pair=col==='r'?['h','d']:['s','c'],tot={},n=0;
  tot[pair[0]]=0;tot[pair[1]]=0;
  list.forEach(function(b){
    if(b.x0<cb.x0||b.x1>cb.x1||b.y0<cb.y0||b.y1>cb.y1)return;
    var asp=b.w/b.h;
    if(asp<0.55||asp>1.7)return;
    var m=suitMask(d,lab,b),s0=suitScore(m,T[pair[0]]),s1=suitScore(m,T[pair[1]]);
    var k=s0>=s1?pair[0]:pair[1],hi=Math.max(s0,s1),lo=Math.min(s0,s1);
    if(hi<0.5||hi-lo<0.05)return;
    tot[k]+=b.w*b.h;n++;
  });
  if(!n||tot[pair[0]]===tot[pair[1]])return null;
  return tot[pair[0]]>tot[pair[1]]?pair[0]:pair[1];
}

/* signe (cœur, carreau, pique, trèfle) reconnu par sa forme : inutile de le passer à l'OCR */
function isSuitBlob(d,lab,b){
  var asp=b.w/b.h;
  if(asp<0.55||asp>1.7)return false;
  var T=suitTemplates(),m=suitMask(d,lab,b),best=0,s;
  for(var key in T){s=suitScore(m,T[key]);if(s>best)best=s;}
  return best>=0.75;
}

/* JOKER : mot de 5 lettres sur la carte (en colonne ou en ligne, droit ou tourné) */
function rotImg(rot){
  var w=mc.width,h=mc.height,sw=(rot%180)?h:w,sh=(rot%180)?w:h;
  rc.width=sw;rc.height=sh;
  rx.fillStyle='#fff';rx.fillRect(0,0,sw,sh);
  rx.save();rx.translate(sw/2,sh/2);rx.rotate(rot*Math.PI/180);rx.drawImage(mc,-w/2,-h/2);rx.restore();
  var sc=100/sh,tw=Math.max(1,Math.round(sw*sc));
  cc.width=tw+60;cc.height=160;
  cx.fillStyle='#fff';cx.fillRect(0,0,cc.width,cc.height);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(rc,30,30,tw,100);
  return cc;
}

function jokerRuns(L,axis){
  var out=[],keys={};
  function pos(b){return axis==='v'?(b.y0+b.y1)/2:(b.x0+b.x1)/2}
  L.forEach(function(a){
    var d=Math.max(a.w,a.h),ca=axis==='v'?(a.x0+a.x1)/2:(a.y0+a.y1)/2;
    var S=L.filter(function(b){
      if(Math.abs(Math.max(b.w,b.h)-d)>0.35*d)return false;
      var cb=axis==='v'?(b.x0+b.x1)/2:(b.y0+b.y1)/2;
      return Math.abs(cb-ca)<0.45*d;
    });
    S.sort(function(p,q){return pos(p)-pos(q)});
    var run=[],i;
    function flush(){
      if(run.length>=4&&run.length<=6&&run.indexOf(a)>=0){
        var key=run.map(function(b){return b.id}).join(',');
        if(!keys[key]){keys[key]=1;out.push(run);}
      }
    }
    for(i=0;i<S.length;i++){
      if(run.length&&pos(S[i])-pos(run[run.length-1])>2.2*d){flush();run=[];}
      run.push(S[i]);
    }
    flush();
  });
  return out;
}

/* lettres de JOKER dans l'ordre : 3 sur 4 formes, ou 4 sur 5 ou 6 (une lettre peut manquer) */
function isJoker(s){
  var W='JOKER',n=s.length,i,j,dp=[];
  if(n<4||n>6)return false;
  for(i=0;i<=n;i++){dp.push(new Array(W.length+1).fill(0));}
  for(i=1;i<=n;i++)for(j=1;j<=W.length;j++){
    dp[i][j]=s[i-1]===W[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  }
  return dp[n][W.length]>=(n<=4?3:4);
}

async function readJoker(dim,lab,run){
  var rots=[0,90,180,270],ri,bi;
  for(ri=0;ri<4;ri++){
    var s='';
    for(bi=0;bi<run.length;bi++){
      blobImg(dim,run[bi],lab);
      var im=rotImg(rots[ri]);
      await worker.setParameters({tessedit_pageseg_mode:'10',tessedit_char_whitelist:'JOKER'});
      var r=await worker.recognize(im),t=(r.data.text||'').trim();
      s+=(t.length===1&&r.data.confidence>=50)?t:'?';
    }
    if(isJoker(s)||isJoker(s.split('').reverse().join('')))return true;
  }
  return false;
}

/* indice de renfort pour le joker : le haut de la carte n'est pas comme le bas.
   Une carte normale est identique à elle-même tournée de 180° ; la mesure va de 0 (symétrique) à 1.
   Seuil à régler selon les essais sur de vraies cartes. */
var JOKER_ASYM=0.35;

/* lecture OCR du mot JOKER (reprise de lecteur_joker.html) : texte lu sur l'image entière, 4 rotations tournées une par image ;
   le mot JOKER ou un morceau (JO, KE, ER…) déclenche la détection */
var JK_MOT='JOKER',JK_MIN=2,JK_CONF=40,JK_SIM=0.7,JK_ROT=[0,90,270,180],JK_HOLD=1000;
var jkI=0,jkLast=null,jkT=0,jc=document.createElement('canvas'),jx=jc.getContext('2d');
function jkDist(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d.push([i].concat(new Array(n).fill(0)));}
  for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function estJokerOcr(texte){
  var t=texte.toUpperCase().replace(/0/g,'O').replace(/[^A-Z]/g,'');
  if(t.length>=JK_MIN&&JK_MOT.indexOf(t)>=0)return true;
  if(t.indexOf(JK_MOT)>=0)return true;
  return t.length>=4&&1-jkDist(t,JK_MOT)/Math.max(t.length,JK_MOT.length)>=JK_SIM;
}
function jkBack(u,v,rot,w,h){
  if(rot===90)return [v,h-u];
  if(rot===270)return [w-v,u];
  if(rot===180)return [w-u,h-v];
  return [u,v];
}
async function readJokerOcr(dim){
  var w=dim.w,h=dim.h,ri,i;
  await worker.setParameters({tessedit_pageseg_mode:'3',tessedit_char_whitelist:''});
  for(ri=0;ri<JK_ROT.length;ri++){
    var rot=JK_ROT[ri];
    if(rot===90||rot===270){jc.width=h;jc.height=w;}else{jc.width=w;jc.height=h;}
    jx.setTransform(1,0,0,1,0,0);
    jx.fillStyle='#fff';jx.fillRect(0,0,jc.width,jc.height);
    if(rot===90){jx.translate(h,0);jx.rotate(Math.PI/2);}
    else if(rot===270){jx.translate(0,w);jx.rotate(-Math.PI/2);}
    else if(rot===180){jx.translate(w,h);jx.rotate(Math.PI);}
    jx.drawImage(work,0,0,w,h);
    jx.setTransform(1,0,0,1,0,0);
    var r=await worker.recognize(jc),mots=(r.data.words||[]).filter(function(m){return m.confidence>=JK_CONF&&m.text&&m.text.trim()}),hit=false;
    for(i=0;i<mots.length;i++){
      if(!estJokerOcr(mots[i].text))continue;
      var bb=mots[i].bbox,pts=[[bb.x0,bb.y0],[bb.x1,bb.y0],[bb.x1,bb.y1],[bb.x0,bb.y1]].map(function(p){return jkBack(p[0],p[1],rot,w,h)});
      var xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
      jkLast={x0:Math.min.apply(null,xs),y0:Math.min.apply(null,ys),x1:Math.max.apply(null,xs),y1:Math.max.apply(null,ys)};
      jkT=Date.now();hit=true;
      break;
    }
    if(hit)break;
  }
  if(jkLast&&Date.now()-jkT<JK_HOLD)return {text:'JOKER',joker:true,sure:true,col:'j',bbox:jkLast};
  return null;
}

function findCards(d){
  var W=d.w,H=d.h,N=W*H,lab=new Int32Array(N),stk=new Int32Array(N),list=[],id=0,s0,minA=0.008*W*H,maxA=0.5*W*H;
  for(s0=0;s0<N;s0++){
    if(d.ink[s0]||lab[s0])continue;
    id++;var sp=0;stk[sp++]=s0;lab[s0]=id;
    var x0=W,y0=H,x1=0,y1=0,area=0;
    while(sp){
      var q=stk[--sp],qx=q%W,qy=(q-qx)/W;
      area++;
      if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      if(qx>0&&!d.ink[q-1]&&!lab[q-1]){lab[q-1]=id;stk[sp++]=q-1;}
      if(qx<W-1&&!d.ink[q+1]&&!lab[q+1]){lab[q+1]=id;stk[sp++]=q+1;}
      if(qy>0&&!d.ink[q-W]&&!lab[q-W]){lab[q-W]=id;stk[sp++]=q-W;}
      if(qy<H-1&&!d.ink[q+W]&&!lab[q+W]){lab[q+W]=id;stk[sp++]=q+W;}
    }
    if(area<minA||area>maxA)continue;
    if(x0===0||y0===0||x1===W-1||y1===H-1)continue;
    var bw=x1-x0+1,bh=y1-y0+1,asp=bw/bh;
    if(asp<0.45||asp>2.2||area/(bw*bh)<0.35)continue;
    list.push({id:id,x0:x0,y0:y0,x1:x1+1,y1:y1+1});
  }
  return {list:list,lab:lab};
}

function cardAsym(d,lab,c){
  var W=d.w,GX=16,GY=24,n=GX*GY,bw=c.x1-c.x0,bh=c.y1-c.y0,x,y,i;
  var minx=new Int32Array(bh).fill(1e9),maxx=new Int32Array(bh).fill(-1),miny=new Int32Array(bw).fill(1e9),maxy=new Int32Array(bw).fill(-1);
  for(y=0;y<bh;y++)for(x=0;x<bw;x++){
    if(lab[(c.y0+y)*W+c.x0+x]===c.id){
      if(x<minx[y])minx[y]=x;if(x>maxx[y])maxx[y]=x;
      if(y<miny[x])miny[x]=y;if(y>maxy[x])maxy[x]=y;
    }
  }
  var ink=new Float32Array(n),tot=new Float32Array(n);
  for(y=0;y<bh;y++){
    var gy=Math.min(GY-1,(y*GY/bh)|0);
    for(x=0;x<bw;x++){
      if(x<minx[y]||x>maxx[y]||y<miny[x]||y>maxy[x])continue;
      var gx=Math.min(GX-1,(x*GX/bw)|0);
      tot[gy*GX+gx]++;
      if(d.ink[(c.y0+y)*W+c.x0+x])ink[gy*GX+gx]++;
    }
  }
  var nom=0.6*bw*bh/n,num=0,den=0,cells=0;
  for(i=0;i<n;i++){
    var j=n-1-i;if(i>=j)break;
    if(tot[i]<nom||tot[j]<nom)continue;
    var a=ink[i]/tot[i],b=ink[j]/tot[j];
    num+=Math.abs(a-b);den+=a+b;cells++;
  }
  return (cells<40||den<0.5)?0:num/den;
}

function mapBox(b,dim){
  var sw=ov.width,sh=ov.height;
  var sc=Math.max(sw/dim.w,sh/dim.h);
  var ox=(sw-dim.w*sc)/2,oy=(sh-dim.h*sc)/2;
  return {x:b.x0*sc+ox,y:b.y0*sc+oy,w:(b.x1-b.x0)*sc,h:(b.y1-b.y0)*sc};
}

function group(acc){
  acc.sort(function(a,b){return a.x0-b.x0});
  var groups=[];
  acc.forEach(function(a){
    for(var i=0;i<groups.length;i++){
      var l=groups[i].items[groups[i].items.length-1];
      if(Math.abs(l.cy-a.cy)<0.4*a.h&&a.x0-l.x1<3*a.h&&Math.abs(l.h-a.h)<0.4*a.h){groups[i].items.push(a);return;}
    }
    groups.push({items:[a]});
  });
  return groups.map(function(g){
    var it=g.items;
    return {text:it.map(function(x){return x.t}).join(''),
      bbox:{x0:Math.min.apply(null,it.map(function(x){return x.x0})),y0:Math.min.apply(null,it.map(function(x){return x.y0})),
            x1:Math.max.apply(null,it.map(function(x){return x.x1})),y1:Math.max.apply(null,it.map(function(x){return x.y1}))}};
  });
}

async function readFrame(){
  var dim=prep();
  if(!dim)return null;
  var jo=await readJokerOcr(dim);
  if(jo)return {dim:dim,words:[jo]};
  var bl=blobs(dim),acc=[],k;
  var allBlobs=bl.list.slice();
  bl.list=bl.list.filter(function(q){return (q.y0+q.y1)/2<dim.h/2});
  bl.list.forEach(function(q){q.suit=isSuitBlob(dim,bl.lab,q)});
  var nOcr=0;
  for(k=0;k<bl.list.length&&nOcr<24;k++){
    var b=bl.list[k];
    if(b.suit)continue;
    nOcr++;
    var img=blobImg(dim,b,bl.lab),pass=[['10','0123456789'],['13','0123456789'],['10','']],pi,t,ok,got=false;
    for(pi=0;pi<3;pi++){
      await worker.setParameters({tessedit_pageseg_mode:pass[pi][0],tessedit_char_whitelist:pass[pi][1]});
      var rr=await worker.recognize(img);
      t=(rr.data.text||'').trim();
      if(pi===2){ok=(/^1?[0Oo]$/.test(t)||/^[KQJ]$/.test(t))&&rr.data.confidence>=70;if(ok)t=t.replace(/[Oo]/,'0');}
      else ok=/^\d{1,2}$/.test(t)&&rr.data.confidence>=50;
      /* un 0 peut être un Q : on revérifie sans liste de chiffres */
      if(ok&&pi<2&&t==='0'){
        await worker.setParameters({tessedit_pageseg_mode:'10',tessedit_char_whitelist:''});
        var rz=await worker.recognize(img);
        if((rz.data.text||'').trim()==='Q'&&rz.data.confidence>=70)t='Q';
      }
      if(ok){b.t=t;b.cy=(b.y0+b.y1)/2;acc.push(b);got=true;break;}
    }
    /* lettres K (roi), Q (dame), J (valet) : lues seulement si ce n'est pas un chiffre */
    if(!got&&b.w/b.h>=0.3&&b.w/b.h<=1.3){
      await worker.setParameters({tessedit_pageseg_mode:'10',tessedit_char_whitelist:'KQJ'});
      var rk=await worker.recognize(img),lt=(rk.data.text||'').trim();
      if(/^[KQJ]$/.test(lt)&&rk.data.confidence>=70){b.t=lt;b.cy=(b.y0+b.y1)/2;acc.push(b);}
    }
  }
  var jwords=[],jb=[],jr=jokerRuns(bl.list.filter(function(q){return !q.suit}),'v').concat(jokerRuns(bl.list.filter(function(q){return !q.suit}),'h')),ji;
  for(ji=0;ji<jr.length&&ji<2;ji++){
    if(await readJoker(dim,bl.lab,jr[ji])){
      jb=jb.concat(jr[ji]);
      jwords.push({text:'JOKER',joker:true,col:'j',bbox:{x0:Math.min.apply(null,jr[ji].map(function(q){return q.x0})),y0:Math.min.apply(null,jr[ji].map(function(q){return q.y0})),x1:Math.max.apply(null,jr[ji].map(function(q){return q.x1})),y1:Math.max.apply(null,jr[ji].map(function(q){return q.y1}))}});
    }
  }
  acc=acc.filter(function(q){return jb.indexOf(q)<0});
  var pairs=[],rest=[],used=[];
  acc.sort(function(p1,p2){return p1.x0-p2.x0});
  acc.forEach(function(a){
    if(used.indexOf(a)>=0)return;
    if(a.t==='0'){
      /* le 0 du 10 : le 1 à sa gauche (fin et haut comme lui) n'a pas été lu comme chiffre */
      var lp=null,i3;
      for(i3=0;i3<bl.list.length;i3++){
        var o3=bl.list[i3];
        if(o3===a||used.indexOf(o3)>=0)continue;
        if(acc.indexOf(o3)>=0&&o3.t!=='1')continue;
        if(o3.w<=0.6*o3.h&&o3.x1<=a.x0+2&&a.x0-o3.x1<1.5*a.h&&Math.abs(o3.h-a.h)<0.3*a.h&&Math.abs((o3.y0+o3.y1)/2-a.cy)<0.3*a.h){lp=o3;break;}
      }
      if(lp&&acc.indexOf(lp)<0){used.push(a);pairs.push({text:'10',bbox:{x0:lp.x0,y0:Math.min(a.y0,lp.y0),x1:a.x1,y1:Math.max(a.y1,lp.y1)}});return;}
    }
    if(a.t!=='1'){rest.push(a);return;}
    var partner=null,i2;
    for(i2=0;i2<bl.list.length;i2++){
      var o=bl.list[i2];
      if(o===a||used.indexOf(o)>=0)continue;
      if(o.x0>=a.x1-2&&o.x0-a.x1<3*a.h&&Math.abs(o.h-a.h)<0.4*a.h&&Math.abs((o.y0+o.y1)/2-a.cy)<0.4*a.h){partner=o;break;}
    }
    if(partner){used.push(partner);pairs.push({text:'10',bbox:{x0:a.x0,y0:Math.min(a.y0,partner.y0),x1:partner.x1,y1:Math.max(a.y1,partner.y1)}});}
    else rest.push(a);
  });
  acc=rest;
  var words=group(acc).filter(function(g){return !/^0+$/.test(g.text)}).concat(pairs).concat(jwords),wi;
  for(wi=0;wi<words.length;wi++){
    var g=words[wi];
    if(g.text!=='1')continue;
    var bb=g.bbox,hh=bb.y1-bb.y0,rx1=Math.min(dim.w,bb.x1+Math.round(3.2*hh));
    if(rx1-bb.x0<hh)continue;
    await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789'});
    var r7=await worker.recognize(regionImg(dim,bb.x0,bb.y0,rx1,bb.y1));
    if(/^10$/.test((r7.data.text||'').trim())&&r7.data.confidence>=50){g.text='10';g.bbox={x0:bb.x0,y0:bb.y0,x1:rx1,y1:bb.y1};}
  }
  words.forEach(function(w){
    if(w.joker)return;
    w.col=cardColor(dim,w.bbox);
    var cb=cardBox(dim,w.bbox);
    if(cb){
      w.cb=cb;
      w.col=cardColor2(dim,bl.lab,allBlobs,cb);
      var sg=suitOf(dim,bl.lab,allBlobs,cb,w.col);if(sg)w.col=sg;
      var cx2=(w.bbox.x0+w.bbox.x1)/2,cy2=(w.bbox.y0+w.bbox.y1)/2;
      w.cd=Math.min(Math.hypot(cx2-cb.x0,cy2-cb.y0),Math.hypot(cx2-cb.x1,cy2-cb.y0));
      var pc=pipCount(cb,allBlobs);w.pc=pc;
    }
  });
  words=words.filter(function(w){
    if(w.joker)return true;
    if(!w.cb||!(w.pc>=1))return false;
    if(/^[KQJ]$/.test(w.text)&&w.cd>0.25*(w.cb.y1-w.cb.y0))return false;
    return !words.some(function(o){return o!==w&&o.cb&&o.cb.x0===w.cb.x0&&o.cb.y0===w.cb.y0&&o.cd<w.cd});
  });
  var fc=findCards(dim);
  fc.list.forEach(function(c){
    var has=words.some(function(w){
      var cx2=(w.bbox.x0+w.bbox.x1)/2,cy2=(w.bbox.y0+w.bbox.y1)/2;
      return cx2>=c.x0&&cx2<=c.x1&&cy2>=c.y0&&cy2<=c.y1;
    });
    if(has)return;
    var nb=allBlobs.filter(function(q){return q.x0>=c.x0&&q.x1<=c.x1&&q.y0>=c.y0&&q.y1<=c.y1}).length;
    if(nb<3)return;
    if(cardAsym(dim,fc.lab,c)>=JOKER_ASYM)words.push({text:'JOKER',joker:true,col:'j',bbox:{x0:c.x0,y0:c.y0,x1:c.x1,y1:c.y1}});
  });
  return {dim:dim,words:words};
}

async function loop(){
  if(!busy&&worker&&v.readyState>=2){
    busy=true;
    try{
      st.textContent='...';
      var fr=await readFrame();
      if(fr){
        var dim=fr.dim,words=fr.words;
        octx.clearRect(0,0,ov.width,ov.height);
        octx.strokeStyle='#ffd54a';octx.lineWidth=3;
        var found=[],cur={},CN={r:'أحمر',n:'أسود',h:'كور',d:'كارو',s:'بيك',c:'تريفل',j:'🃏'};
        words.forEach(function(w){
          var key=w.text+'|'+w.col;
          cur[key]=(seen[key]||0)+1;
          if(cur[key]>=3||w.sure){
            var m=mapBox(w.bbox,dim);
            octx.strokeRect(m.x,m.y,m.w,m.h);
            if(found.indexOf(key)<0)found.push(key);
          }
        });
        seen=cur;
        nums.textContent=found.length?found.map(function(k){var q=k.split('|');return q[0]+' '+CN[q[1]]}).join('  '):'—';
        st.textContent=found.length?found.length+' ✓':'جاهز';
        var now=Date.now();
        found.forEach(function(k){
          if(!lastSpoken[k]||now-lastSpoken[k]>5000){
            var q=k.split('|'),n=q[0];
            beep();
            var pk=pickPack();
            speak((pk.p.n[n]||(n.length>1&&n.length<=6?String(parseInt(n,10)):n.split('').join(' ')))+' '+pk.p.s[q[1]],pk.p.lang,pk.v);
          }
          lastSpoken[k]=now;
        });
      }
    }catch(e){st.textContent='خطأ';}
    busy=false;
  }
  setTimeout(loop,150);
}
})();
