<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Détecteur d’as – Rami</title>
<style>
:root{--bg:#f4f1ea;--fg:#1c1c1c;--card:#fff;--ok:#1a7f45;--no:#8a8a8a;--ac:#b3261e;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--card:#22252a;--ok:#4cc27f;--no:#888;--ac:#ff7a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.4rem 0}
p.s{margin:.2rem 0 1rem;opacity:.75;font-size:.9rem}
.v{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
video{width:100%;height:100%;object-fit:cover;display:block}
.g{position:absolute;left:50%;top:50%;height:70%;aspect-ratio:5/7;transform:translate(-50%,-50%);border:3px dashed #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:border-color .2s}
.g.ok{border-color:#4cc27f;border-style:solid}
#res{margin:14px 0 6px;font-size:2rem;font-weight:700;color:var(--no);min-height:2.6rem}
#res.ok{color:var(--ok)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer}
canvas#m{width:72px;image-rendering:pixelated;border:1px solid var(--no);border-radius:4px;margin-top:10px;background:#fff}
small{display:block;opacity:.65;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>♠ Détecteur d’as – Rami</h1>
<p class="s">Placez une carte dans le cadre. L’analyse se fait en direct, sans aucune photo.</p>
<div class="v"><video id="v" playsinline muted autoplay></video><div class="g" id="g"></div></div>
<div id="res">—</div>
<button id="b">Activer la caméra</button><br>
<canvas id="m" width="90" height="126" title="Ce que l’appli « voit »"></canvas>
<small>Cadrez la carte bien droite, bien éclairée, sur fond uni. L’appli lit seulement vos propres cartes. Détection approximative : elle compte les grands symboles au centre (un seul = as).</small>
</main>
<script>
const v=document.getElementById('v'),b=document.getElementById('b'),res=document.getElementById('res'),g=document.getElementById('g');
const W=90,H=126,c=document.createElement('canvas');c.width=W;c.height=H;
const x=c.getContext('2d',{willReadFrequently:true});
const mc=document.getElementById('m'),mx=mc.getContext('2d');
let hist=[];
b.onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    v.srcObject=s;await v.play();b.style.display='none';loop();
  }catch(e){res.textContent='Caméra refusée';}
};
function analyse(){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  // zone du cadre (70% de la hauteur affichée, ratio 5:7), en tenant compte du recadrage "cover"
  const r=v.clientWidth/v.clientHeight,vr=vw/vh;
  let sw=vw,sh=vh,sx=0,sy=0;
  if(vr>r){sw=vh*r;sx=(vw-sw)/2}else{sh=vw/r;sy=(vh-sh)/2}
  const ch=sh*.7,cw=ch*5/7;
  x.drawImage(v,sx+(sw-cw)/2,sy+(sh-ch)/2,cw,ch,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,n=W*H,gray=new Uint8Array(n),red=new Uint8Array(n);
  for(let i=0;i<n;i++){const R=d[i*4],G=d[i*4+1],B=d[i*4+2];gray[i]=(R+G+B)/3;red[i]=R-Math.max(G,B)>45?1:0}
  // fond de la carte = médiane de la zone centrale claire
  const s=[];for(let i=0;i<n;i+=7)s.push(gray[i]);s.sort((a,b)=>a-b);
  const bg=s[Math.floor(s.length*.8)];
  const ink=new Uint8Array(n);
  for(let i=0;i<n;i++)ink[i]=(gray[i]<bg-70||red[i])?1:0;
  // région centrale
  const x0=Math.floor(W*.2),x1=Math.floor(W*.8),y0=Math.floor(H*.14),y1=Math.floor(H*.86);
  const reg=(x1-x0)*(y1-y0);
  const lab=new Int32Array(n),blobs=[];
  const id=mx.createImageData(W,H);
  for(let i=0;i<n;i++){const o=ink[i]?20:255;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=o;id.data[i*4+3]=255}
  mx.putImageData(id,0,0);
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){
    const p=yy*W+xx;if(!ink[p]||lab[p])continue;
    const st=[p];lab[p]=1;let a=0,sx2=0,sy2=0;
    while(st.length){const q=st.pop();a++;const qx=q%W,qy=(q/W)|0;sx2+=qx;sy2+=qy;
      for(const nb of [q-1,q+1,q-W,q+W]){const nx=nb%W,ny=(nb/W)|0;
        if(nx>=x0&&nx<x1&&ny>=y0&&ny<y1&&ink[nb]&&!lab[nb]){lab[nb]=1;st.push(nb)}}}
    blobs.push({a,cx:sx2/a,cy:sy2/a});
  }
  const big=blobs.filter(o=>o.a>reg*.012).sort((p,q)=>q.a-p.a);
  if(!big.length)return false;
  const m=big[0];
  const centered=Math.abs(m.cx-W/2)<W*.14&&Math.abs(m.cy-H/2)<H*.14;
  return big.length===1&&m.a>reg*.04&&m.a<reg*.3&&centered;
}
function loop(){
  const r=analyse();
  if(r!==null){
    hist.push(r?1:0);if(hist.length>6)hist.shift();
    const ok=hist.reduce((a,b)=>a+b,0)>=4;
    res.textContent=ok?'✅ C’est un AS':'Pas un as';
    res.className=ok?'ok':'';g.className='g'+(ok?' ok':'');
  }
  setTimeout(()=>requestAnimationFrame(loop),120);
}
</script>
</body>
</html>
