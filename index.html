<style>
:root{--b1:#020b2e;--b2:#0d1a6e;--g1:#ffd700;--g2:#ffcc00;--g3:#ffe566}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--b1);color:#fff;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
canvas#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(rgba(2,11,46,.94),rgba(2,11,46,.6));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--g3)}
#top::after,#bottom::before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g1),var(--g3),var(--g1),transparent);background-size:200% 100%;animation:shim 3.5s linear infinite}
#top::after{bottom:0}
#st{padding:4px 14px;border-radius:999px;border:1px solid rgba(255,215,0,.4);background:rgba(13,26,110,.6);font-weight:700}
#mute{cursor:pointer;font-size:20px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,215,0,.45);background:rgba(13,26,110,.6)}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:18px 14px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(2,11,46,.6),rgba(2,11,46,.95));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:center}
#bottom::before{top:0}
#nums{font-size:44px;font-weight:800;letter-spacing:2px;direction:ltr;min-height:56px;color:var(--g1);word-break:break-all;text-shadow:0 0 18px rgba(255,215,0,.45)}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 90% at 50% 0%,var(--b2) 0%,var(--b1) 72%);z-index:5;overflow:hidden}
.card{position:relative;width:100%;max-width:500px;padding:46px 26px 34px;border-radius:26px;text-align:center;background:linear-gradient(160deg,rgba(13,26,110,.72),rgba(2,11,46,.84));border:1px solid rgba(255,215,0,.38);box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 0 40px rgba(255,215,0,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;gap:18px;animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.shim{position:absolute;left:8%;right:8%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--g1),var(--g3),var(--g1),transparent);background-size:200% 100%;animation:shim 3.5s linear infinite}
.shim.t{top:0}.shim.b{bottom:0}
.orn{position:absolute;width:30px;height:30px;animation:spin 20s linear infinite}
.orn::before,.orn::after{content:"";position:absolute;inset:5px;border:1.5px solid var(--g2);border-radius:3px}
.orn::after{transform:rotate(45deg)}
.orn.tl{top:12px;left:12px}.orn.tr{top:12px;right:12px}.orn.bl{bottom:12px;left:12px}.orn.br{bottom:12px;right:12px}
.bsm{font-family:"Amiri","Traditional Arabic",serif;font-size:27px;color:var(--g3);text-shadow:0 0 14px rgba(255,215,0,.35);line-height:1.7;animation:fadeUp 1s .15s cubic-bezier(.2,.8,.2,1) both}
.ttl{font-size:36px;font-weight:800;line-height:1.3;background:linear-gradient(90deg,var(--g2),var(--g3),var(--g1),var(--g3),var(--g2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 5s linear infinite,fadeUp 1s .3s cubic-bezier(.2,.8,.2,1) both}
.sep{width:130px;height:1px;background:linear-gradient(90deg,transparent,var(--g1),transparent)}
button{font:inherit;border:0;border-radius:999px;padding:15px 44px;font-size:19px;background:linear-gradient(180deg,var(--g3),var(--g2) 55%,#e6b800);color:var(--b2);font-weight:800;box-shadow:0 8px 26px rgba(255,204,0,.35),inset 0 1px 0 rgba(255,255,255,.55);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeUp 1s .45s cubic-bezier(.2,.8,.2,1) both}
button:active{transform:scale(.96);box-shadow:0 3px 12px rgba(255,204,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
#msg{font-size:14px;color:var(--g3);opacity:.9;padding:0 10px;text-align:center;min-height:20px}
@keyframes shim{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="start">
  <div class="card">
    <i class="shim t"></i><i class="shim b"></i>
    <i class="orn tl"></i><i class="orn tr"></i><i class="orn bl"></i><i class="orn br"></i>
    <div class="bsm">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="ttl">قارئ الأرقام</div>
    <div class="sep"></div>
    <button id="go">ابدأ الكاميرا</button>
    <div id="msg"></div>
  </div>
</div>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="top"><span id="st">...</span><span id="mute">🔊</span></div>
  <div id="bottom"><div id="nums">—</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
var v=document.getElementById('v'),ov=document.getElementById('ov'),octx=ov.getContext('2d');
var nums=document.getElementById('nums'),st=document.getElementById('st'),msg=document.getElementById('msg');
var work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
var worker=null,busy=false,voiceOn=true,lastSpoken={},stream=null,seen={};
var arVoice=null;

function pickVoice(){
  var vs=speechSynthesis.getVoices();
  arVoice=vs.find(function(x){return /^ar/i.test(x.lang)})||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

function speak(t){
  if(!voiceOn||!('speechSynthesis' in window))return;
  var u=new SpeechSynthesisUtterance(t);
  u.lang='ar-SA';if(arVoice)u.voice=arVoice;u.rate=0.9;
  speechSynthesis.speak(u);
}

document.getElementById('mute').onclick=function(){
  voiceOn=!voiceOn;this.textContent=voiceOn?'🔊':'🔇';
  if(!voiceOn)speechSynthesis.cancel();
};

function fit(){ov.width=innerWidth;ov.height=innerHeight;}
addEventListener('resize',fit);fit();

document.getElementById('go').onclick=async function(){
  msg.textContent='...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=stream;await v.play();
  }catch(e){msg.textContent='تعذّر فتح الكاميرا: '+e.message;return;}
  document.getElementById('start').style.display='none';
  speak('');
  st.textContent='تحميل...';
  try{
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'10'});
  }catch(e){st.textContent='خطأ: '+e.message;return;}
  st.textContent='جاهز';
  loop();
};

var cc=document.createElement('canvas'),cx=cc.getContext('2d');
var mc=document.createElement('canvas'),mx2=mc.getContext('2d');

function prep(){
  var vw=v.videoWidth,vh=v.videoHeight;
  if(!vw)return null;
  var s=Math.min(1,1280/vw),W=Math.round(vw*s),H=Math.round(vh*s);
  work.width=W;work.height=H;
  wctx.drawImage(v,0,0,W,H);
  var p=wctx.getImageData(0,0,W,H).data,N=W*H,gray=new Uint8Array(N),hist=new Array(256).fill(0),i,g;
  for(i=0;i<N;i++){g=(0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2])|0;gray[i]=g;hist[g]++;}
  var sum=0;for(i=0;i<256;i++)sum+=i*hist[i];
  var sB=0,wB=0,mx=0,th=128;
  for(i=0;i<256;i++){
    wB+=hist[i];if(!wB)continue;
    var wF=N-wB;if(!wF)break;
    sB+=i*hist[i];
    var mB=sB/wB,mF=(sum-sB)/wF,bt=wB*wF*(mB-mF)*(mB-mF);
    if(bt>mx){mx=bt;th=i;}
  }
  var ink=new Uint8Array(N);
  for(i=0;i<N;i++)ink[i]=gray[i]<=th?1:0;
  return {w:W,h:H,ink:ink,rgb:p};
}

function blobs(d){
  var W=d.w,H=d.h,ink=d.ink,N=W*H,lab=new Int32Array(N),stack=new Int32Array(N),res=[],id=0,s0;
  for(s0=0;s0<N;s0++){
    if(!ink[s0]||lab[s0])continue;
    id++;var sp=0;stack[sp++]=s0;lab[s0]=id;
    var x0=W,y0=H,x1=0,y1=0,area=0;
    while(sp){
      var q=stack[--sp],qx=q%W,qy=(q-qx)/W;
      area++;
      if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      if(qx>0&&ink[q-1]&&!lab[q-1]){lab[q-1]=id;stack[sp++]=q-1;}
      if(qx<W-1&&ink[q+1]&&!lab[q+1]){lab[q+1]=id;stack[sp++]=q+1;}
      if(qy>0&&ink[q-W]&&!lab[q-W]){lab[q-W]=id;stack[sp++]=q-W;}
      if(qy<H-1&&ink[q+W]&&!lab[q+W]){lab[q+W]=id;stack[sp++]=q+W;}
    }
    var w=x1-x0+1,h=y1-y0+1;
    if(h<H*0.025||h>H*0.25||w>W*0.2)continue;
    if(x0===0||y0===0||x1===W-1||y1===H-1)continue;
    if(h/w<0.5||h/w>8||area<30)continue;
    res.push({id:id,x0:x0,y0:y0,x1:x1+1,y1:y1+1,w:w,h:h});
  }
  return {list:res,lab:lab};
}

function blobImg(d,b,lab){
  mc.width=b.w;mc.height=b.h;
  var im=mx2.createImageData(b.w,b.h),o=im.data,x,y,k=0;
  for(y=b.y0;y<b.y1;y++)for(x=b.x0;x<b.x1;x++){
    var c=lab[y*d.w+x]===b.id?0:255;
    o[k++]=c;o[k++]=c;o[k++]=c;o[k++]=255;
  }
  mx2.putImageData(im,0,0);
  var sc=100/b.h,tw=Math.max(1,Math.round(b.w*sc));
  cc.width=tw+60;cc.height=160;
  cx.fillStyle='#fff';cx.fillRect(0,0,cc.width,cc.height);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(mc,30,30,tw,100);
  return cc;
}

function regionImg(d,x0,y0,x1,y1){
  var w=x1-x0,h=y1-y0;
  mc.width=w;mc.height=h;
  var im=mx2.createImageData(w,h),o=im.data,x,y,k=0;
  for(y=y0;y<y1;y++)for(x=x0;x<x1;x++){
    var c=d.ink[y*d.w+x]?0:255;
    o[k++]=c;o[k++]=c;o[k++]=c;o[k++]=255;
  }
  mx2.putImageData(im,0,0);
  var sc=100/h,tw=Math.max(1,Math.round(w*sc));
  cc.width=tw+60;cc.height=160;
  cx.fillStyle='#fff';cx.fillRect(0,0,cc.width,cc.height);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(mc,30,30,tw,100);
  return cc;
}

function cardColor(d,bb){
  var r=0,t=0,x,y;
  for(y=bb.y0;y<bb.y1;y++)for(x=bb.x0;x<bb.x1;x++){
    var i=y*d.w+x;
    if(!d.ink[i])continue;
    var R=d.rgb[i*4],G=d.rgb[i*4+1],B=d.rgb[i*4+2];
    t++;
    if(R>90&&R>G*1.5&&R>B*1.5)r++;
  }
  return t&&r/t>0.3?'r':'n';
}

function cardBox(d,bb){
  var W=d.w,H=d.h,sx=bb.x0-4,sy=Math.round((bb.y0+bb.y1)/2),k=0;
  if(sx<1)return null;
  while(sx>0&&d.ink[sy*W+sx]&&k<40){sx--;k++;}
  if(sx<=0||d.ink[sy*W+sx])return null;
  var vis=new Uint8Array(W*H),stk=new Int32Array(W*H),sp=0,s0=sy*W+sx;
  var x0=W,y0=H,x1=0,y1=0,cnt=0;
  vis[s0]=1;stk[sp++]=s0;
  while(sp){
    var q=stk[--sp],qx=q%W,qy=(q-qx)/W;
    cnt++;
    if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
    if(qx>0&&!d.ink[q-1]&&!vis[q-1]){vis[q-1]=1;stk[sp++]=q-1;}
    if(qx<W-1&&!d.ink[q+1]&&!vis[q+1]){vis[q+1]=1;stk[sp++]=q+1;}
    if(qy>0&&!d.ink[q-W]&&!vis[q-W]){vis[q-W]=1;stk[sp++]=q-W;}
    if(qy<H-1&&!d.ink[q+W]&&!vis[q+W]){vis[q+W]=1;stk[sp++]=q+W;}
  }
  if(cnt>W*H*0.6)return null;
  return {x0:x0,y0:y0,x1:x1+1,y1:y1+1};
}

function pipCount(cb,all){
  return all.filter(function(b){
    return b.x0>=cb.x0&&b.x1<=cb.x1&&b.y0>=cb.y0&&b.y1<=cb.y1;
  }).length;
}

function cardColor2(d,lab,list,cb){
  var r=0,t=0;
  list.forEach(function(b){
    if(b.x0<cb.x0||b.x1>cb.x1||b.y0<cb.y0||b.y1>cb.y1)return;
    var x,y;
    for(y=b.y0;y<b.y1;y++)for(x=b.x0;x<b.x1;x++){
      var i=y*d.w+x;
      if(lab[i]!==b.id)continue;
      var R=d.rgb[i*4],G=d.rgb[i*4+1],B=d.rgb[i*4+2],mx=Math.max(R,G,B);
      t++;
      if(R>=G&&R>=B&&mx>0&&(R-Math.max(G,B))/mx>0.3)r++;
    }
  });
  return t&&r/t>0.5?'r':'n';
}

function suitTemplates(){
  if(SUIT_TPL)return SUIT_TPL;
  var n=SUIT_N*SUIT_N;
  SUIT_TPL={};
  Object.keys(SUIT_LIB).forEach(function(k){
    SUIT_TPL[k]=SUIT_LIB[k].map(function(sb){
      var bin=atob(sb),a=new Uint8Array(n),b=new Uint8Array(n),i;
      for(i=0;i<n;i++)a[i]=(bin.charCodeAt(i>>3)>>(i&7))&1;
      for(i=0;i<n;i++)b[i]=a[n-1-i];
      return {a:a,b:b};
    });
  });
  return SUIT_TPL;
}

function suitScore(m,list){
  var best=0,i,s;
  for(i=0;i<list.length;i++){
    s=Math.max(suitIou(m,list[i].a),suitIou(m,list[i].b));
    if(s>best)best=s;
  }
  return best;
}

function suitMask(d,lab,b){
  var N=SUIT_N,cnt=new Uint16Array(N*N),tot=new Uint16Array(N*N),m=new Uint8Array(N*N),x,y,i;
  for(y=b.y0;y<b.y1;y++){
    var gy=Math.min(N-1,((y-b.y0)*N/b.h)|0);
    for(x=b.x0;x<b.x1;x++){
      var gx=Math.min(N-1,((x-b.x0)*N/b.w)|0);
      tot[gy*N+gx]++;
      if(lab[y*d.w+x]===b.id)cnt[gy*N+gx]++;
    }
  }
  for(i=0;i<N*N;i++)m[i]=tot[i]&&cnt[i]*2>tot[i]?1:0;
  return m;
}

function suitIou(p,q){
  var a=0,o=0,i;
  for(i=0;i<p.length;i++){if(p[i]&&q[i])a++;if(p[i]||q[i])o++;}
  return o?a/o:0;
}

/* signe de la carte : rouge = cœur (h) ou carreau (d), noir = pique (s) ou trèfle (c) ; la forme départage, symbole droit ou renversé */
function suitOf(d,lab,list,cb,col){
  var T=suitTemplates(),pair=col==='r'?['h','d']:['s','c'],tot={},n=0;
  tot[pair[0]]=0;tot[pair[1]]=0;
  list.forEach(function(b){
    if(b.x0<cb.x0||b.x1>cb.x1||b.y0<cb.y0||b.y1>cb.y1)return;
    var asp=b.w/b.h;
    if(asp<0.55||asp>1.7)return;
    var m=suitMask(d,lab,b),s0=suitScore(m,T[pair[0]]),s1=suitScore(m,T[pair[1]]);
    var k=s0>=s1?pair[0]:pair[1],hi=Math.max(s0,s1),lo=Math.min(s0,s1);
    if(hi<0.5||hi-lo<0.05)return;
    tot[k]+=b.w*b.h;n++;
  });
  if(!n||tot[pair[0]]===tot[pair[1]])return null;
  return tot[pair[0]]>tot[pair[1]]?pair[0]:pair[1];
}

/* forme déjà reconnue comme un signe (pique, trèfle, cœur, carreau) : pas de lecture de lettre */
function isSuit(d,lab,b){
  var T=suitTemplates(),m=suitMask(d,lab,b),k;
  for(k in T){if(suitScore(m,T[k])>=0.75)return true;}
  return false;
}

/* l'indice est dans un coin supérieur de la carte : sinon pas de lecture de lettre */
function cornerOK(d,b,cbs){
  var cb=null,i;
  for(i=0;i<cbs.length;i++){var c=cbs[i];if(b.x0>=c.x0&&b.x1<=c.x1&&b.y0>=c.y0&&b.y1<=c.y1){cb=c;break;}}
  if(!cb){cb=cardBox(d,b);if(!cb)return false;cbs.push(cb);}
  var cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;
  return Math.min(Math.hypot(cx-cb.x0,cy-cb.y0),Math.hypot(cx-cb.x1,cy-cb.y0))<=0.25*(cb.y1-cb.y0);
}

function mapBox(b,dim){
  var sw=ov.width,sh=ov.height;
  var sc=Math.max(sw/dim.w,sh/dim.h);
  var ox=(sw-dim.w*sc)/2,oy=(sh-dim.h*sc)/2;
  return {x:b.x0*sc+ox,y:b.y0*sc+oy,w:(b.x1-b.x0)*sc,h:(b.y1-b.y0)*sc};
}

function group(acc){
  acc.sort(function(a,b){return a.x0-b.x0});
  var groups=[];
  acc.forEach(function(a){
    for(var i=0;i<groups.length;i++){
      var l=groups[i].items[groups[i].items.length-1];
      if(Math.abs(l.cy-a.cy)<0.4*a.h&&a.x0-l.x1<3*a.h&&Math.abs(l.h-a.h)<0.4*a.h){groups[i].items.push(a);return;}
    }
    groups.push({items:[a]});
  });
  return groups.map(function(g){
    var it=g.items;
    return {text:it.map(function(x){return x.t}).join(''),
      bbox:{x0:Math.min.apply(null,it.map(function(x){return x.x0})),y0:Math.min.apply(null,it.map(function(x){return x.y0})),
            x1:Math.max.apply(null,it.map(function(x){return x.x1})),y1:Math.max.apply(null,it.map(function(x){return x.y1}))}};
  });
}

async function readFrame(){
  var dim=prep();
  if(!dim)return null;
  var bl=blobs(dim),acc=[],k;
  var allBlobs=bl.list.slice();
  var cbs=[];
  bl.list=bl.list.filter(function(q){return (q.y0+q.y1)/2<dim.h/2});
  for(k=0;k<bl.list.length&&k<24;k++){
    var b=bl.list[k];
    var img=blobImg(dim,b,bl.lab),pass=[['10','0123456789'],['13','0123456789'],['10','']],pi,t,ok,got=false;
    for(pi=0;pi<3;pi++){
      await worker.setParameters({tessedit_pageseg_mode:pass[pi][0],tessedit_char_whitelist:pass[pi][1]});
      var rr=await worker.recognize(img);
      t=(rr.data.text||'').trim();
      if(pi===2){ok=/^1?[0Oo]$/.test(t)&&rr.data.confidence>=70;if(ok)t=t.replace(/[Oo]/,'0');}
      else ok=/^\d{1,2}$/.test(t)&&rr.data.confidence>=50;
      if(ok){b.t=t;b.cy=(b.y0+b.y1)/2;acc.push(b);got=true;break;}
    }
    /* lettres K (roi), Q (dame), J (valet), A (as) : lues seulement si ce n'est pas un chiffre */
    if(!got&&b.w/b.h>=0.3&&b.w/b.h<=1.3&&!isSuit(dim,bl.lab,b)&&cornerOK(dim,b,cbs)){
      await worker.setParameters({tessedit_pageseg_mode:'8',tessedit_char_whitelist:'KQJA'});
      var rk=await worker.recognize(img),lt=(rk.data.text||'').trim();
      if(/^[KQJA]$/.test(lt)&&rk.data.confidence>=50){b.t=lt;b.cy=(b.y0+b.y1)/2;acc.push(b);}
    }
  }
  var pairs=[],rest=[],used=[];
  acc.sort(function(p1,p2){return p1.x0-p2.x0});
  acc.forEach(function(a){
    if(used.indexOf(a)>=0)return;
    if(a.t!=='1'){rest.push(a);return;}
    var partner=null,i2;
    for(i2=0;i2<bl.list.length;i2++){
      var o=bl.list[i2];
      if(o===a||used.indexOf(o)>=0)continue;
      if(o.x0>=a.x1-2&&o.x0-a.x1<3*a.h&&Math.abs(o.h-a.h)<0.4*a.h&&Math.abs((o.y0+o.y1)/2-a.cy)<0.4*a.h){partner=o;break;}
    }
    if(partner){used.push(partner);pairs.push({text:'10',bbox:{x0:a.x0,y0:Math.min(a.y0,partner.y0),x1:partner.x1,y1:Math.max(a.y1,partner.y1)}});}
    else rest.push(a);
  });
  acc=rest;
  var words=group(acc).filter(function(g){return !/^0+$/.test(g.text)}).concat(pairs),wi;
  for(wi=0;wi<words.length;wi++){
    var g=words[wi];
    if(g.text!=='1')continue;
    var bb=g.bbox,hh=bb.y1-bb.y0,rx1=Math.min(dim.w,bb.x1+Math.round(3.2*hh));
    if(rx1-bb.x0<hh)continue;
    await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789'});
    var r7=await worker.recognize(regionImg(dim,bb.x0,bb.y0,rx1,bb.y1));
    if(/^10$/.test((r7.data.text||'').trim())&&r7.data.confidence>=50){g.text='10';g.bbox={x0:bb.x0,y0:bb.y0,x1:rx1,y1:bb.y1};}
  }
  words.forEach(function(w){
    w.col=cardColor(dim,w.bbox);
    var cb=cardBox(dim,w.bbox);
    if(cb){
      w.cb=cb;
      w.col=cardColor2(dim,bl.lab,allBlobs,cb);
      var sg=suitOf(dim,bl.lab,allBlobs,cb,w.col);if(sg)w.col=sg;
      var cx2=(w.bbox.x0+w.bbox.x1)/2,cy2=(w.bbox.y0+w.bbox.y1)/2;
      w.cd=Math.min(Math.hypot(cx2-cb.x0,cy2-cb.y0),Math.hypot(cx2-cb.x1,cy2-cb.y0));
      var pc=pipCount(cb,allBlobs);w.pc=pc;if(pc>=1&&pc<=8&&!/^[KQJA]$/.test(w.text))w.text=String(pc);
    }
  });
  words=words.filter(function(w){
    if(!w.cb||!(w.pc>=1))return false;
    if(/^[KQJA]$/.test(w.text)&&w.cd>0.25*(w.cb.y1-w.cb.y0))return false;
    return !words.some(function(o){return o!==w&&o.cb&&o.cb.x0===w.cb.x0&&o.cb.y0===w.cb.y0&&o.cd<w.cd});
  });
  return {dim:dim,words:words};
}

async function loop(){
  if(!busy&&worker&&v.readyState>=2){
    busy=true;
    try{
      st.textContent='...';
      var fr=await readFrame();
      if(fr){
        var dim=fr.dim,words=fr.words;
        octx.clearRect(0,0,ov.width,ov.height);
        octx.strokeStyle='#ffd54a';octx.lineWidth=3;
        var found=[],cur={},CN={r:'أحمر',n:'أسود',h:'كور',d:'كارو',s:'بيك',c:'تريفل'};
        words.forEach(function(w){
          var key=w.text+'|'+w.col;
          cur[key]=(seen[key]||0)+1;
          if(cur[key]>=3){
            var m=mapBox(w.bbox,dim);
            octx.strokeRect(m.x,m.y,m.w,m.h);
            if(found.indexOf(key)<0)found.push(key);
          }
        });
        seen=cur;
        nums.textContent=found.length?found.map(function(k){var q=k.split('|');return q[0]+' '+CN[q[1]]}).join('  '):'—';
        st.textContent=found.length?found.length+' ✓':'جاهز';
        var now=Date.now();
        found.forEach(function(k){
          if(!lastSpoken[k]||now-lastSpoken[k]>5000){
            var q=k.split('|'),n=q[0];
            speak((n.length>1&&n.length<=6?String(parseInt(n,10)):n.split('').join(' '))+' '+CN[q[1]]);
          }
          lastSpoken[k]=now;
        });
      }
    }catch(e){st.textContent='خطأ';}
    busy=false;
  }
  setTimeout(loop,150);
}
})();
</script>
